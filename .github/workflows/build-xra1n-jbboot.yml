name: Build XRa1n JBBoot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xra1n-jbboot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout XRa1n
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install verification tool
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid-procursus xz
          command -v ldid
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build Liter8-compatible Sileo payload
        shell: bash
        run: |
          set -euo pipefail
          OUT="$PWD/work/xra1n-jbboot"
          WORK="$RUNNER_TEMP/xra1n-sileo"
          VER=2.5.1
          DEB="org.coolstar.sileo_${VER}_iphoneos-arm64.deb"
          URL="https://github.com/Sileo/Sileo/releases/download/${VER}/${DEB}"
          EXPECTED=8e3c90e5a7d32f4ca207a0ac30d3cfa8a13dca86a2b4e11cb3f9e5c68d7bc97a
          rm -rf "$WORK"
          mkdir -p "$WORK/extract" "$OUT"
          curl --fail --location --retry 3 -o "$WORK/$DEB" "$URL"
          test "$(shasum -a 256 "$WORK/$DEB" | awk '{print $1}')" = "$EXPECTED"
          (cd "$WORK/extract" && ar x "$WORK/$DEB" && xz -dc data.tar.xz | tar xf -)
          APP="$WORK/extract/var/jb/Applications/Sileo.app"
          test -d "$APP"
          xz -dc "$WORK/extract/data.tar.xz" | tar tvf - 2>/dev/null | grep -q '^-rws.*giveMeRoot$'

          python3 - "$APP/Sileo" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          blob = path.read_bytes()
          replacements = (
              (b"/var/jb/.installed_xina15", b"/var/jb/.installed_usbl8r"),
              (b"mobile:mobile", b"000501:000501"),
          )
          for old, new in replacements:
              if len(old) != len(new) or blob.count(old) != 1:
                  raise SystemExit(f"unexpected Sileo pre-image count for {old!r}: {blob.count(old)}")
              blob = blob.replace(old, new)
          path.write_bytes(blob)
          PY

          cat > "$WORK/sileo.ent" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>platform-application</key><true/>
            <key>com.apple.private.security.no-sandbox</key><true/>
            <key>com.apple.private.security.no-container</key><true/>
            <key>com.apple.private.security.container-required</key><false/>
            <key>com.apple.private.skip-library-validation</key><true/>
            <key>com.apple.private.security.storage-exempt.heritable</key><true/>
            <key>com.apple.private.persona-mgmt</key><true/>
            <key>com.apple.private.spawn-subsystem-root</key><true/>
          </dict></plist>
          EOF
          ldid -Iorg.coolstar.SileoStore -S"$WORK/sileo.ent" -Cadhoc "$APP/Sileo"
          ldid -IgiveMeRoot -S"$WORK/sileo.ent" -Cadhoc "$APP/giveMeRoot"
          chmod 4755 "$APP/giveMeRoot"
          test -u "$APP/giveMeRoot"

          python3 - "$APP" <<'PY'
          import hashlib, os, plistlib, sys
          app = sys.argv[1]
          resource = os.path.join(app, "_CodeSignature", "CodeResources")
          data = plistlib.load(open(resource, "rb"))
          fixed = 0
          for section in ("files", "files2"):
              files = data.get(section)
              if not isinstance(files, dict):
                  continue
              for name, entry in files.items():
                  target = os.path.join(app, name)
                  if os.path.basename(name) != "giveMeRoot" or not os.path.isfile(target):
                      continue
                  blob = open(target, "rb").read()
                  if isinstance(entry, dict):
                      if "hash2" in entry: entry["hash2"] = hashlib.sha256(blob).digest()
                      if "hash" in entry: entry["hash"] = hashlib.sha1(blob).digest()
                  else:
                      files[name] = hashlib.sha1(blob).digest()
                  fixed += 1
          if not fixed:
              raise SystemExit("giveMeRoot is absent from CodeResources")
          plistlib.dump(data, open(resource, "wb"))
          PY

          codesign --force --sign - --timestamp=none --entitlements "$WORK/sileo.ent" "$APP"
          codesign --verify --strict "$APP"
          python3 - "$APP/Sileo" "$WORK/sileo.ent" <<'PY'
          import pathlib, plistlib, subprocess, sys
          actual = plistlib.loads(subprocess.check_output(["ldid", "-e", sys.argv[1]]))
          expected = plistlib.loads(pathlib.Path(sys.argv[2]).read_bytes())
          if actual != expected:
              raise SystemExit("Sileo entitlement verification failed")
          PY
          test "$(strings -a "$APP/Sileo" | grep -Fc /var/jb/.installed_usbl8r)" = 1
          test "$(strings -a "$APP/Sileo" | grep -Fc 000501:000501)" = 1
          tar -C "$(dirname "$APP")" -czpf "$OUT/Sileo.app.tar.gz" Sileo.app
          shasum -a 256 "$OUT/Sileo.app.tar.gz" > "$OUT/Sileo.app.tar.gz.sha256"

      - name: Build signed universal helper
        shell: bash
        run: |
          set -euo pipefail
          OUT=work/xra1n-jbboot
          SOURCE=jbboot/xra1n_jbboot.c
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos --find clang)"
          mkdir -p "$OUT"

          cat > "$OUT/xra1n-jbboot.entitlements" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>platform-application</key><true/>
            <key>com.apple.private.security.no-sandbox</key><true/>
            <key>com.apple.private.security.no-container</key><true/>
            <key>com.apple.private.skip-library-validation</key><true/>
            <key>com.apple.private.persona-mgmt</key><true/>
            <key>com.apple.private.spawn-subsystem-root</key><true/>
          </dict></plist>
          EOF

          for arch in arm64 arm64e; do
            "$CLANG" \
              -target "${arch}-apple-ios18.0" \
              -isysroot "$SDK" \
              -Os -fvisibility=hidden -fno-common \
              -Wall -Wextra -Werror \
              -Wl,-dead_strip \
              "$SOURCE" \
              -o "$OUT/xra1n-jbboot.${arch}"
            codesign --force --sign - --timestamp=none \
              --entitlements "$OUT/xra1n-jbboot.entitlements" \
              -i com.xra1n.jbboot "$OUT/xra1n-jbboot.${arch}"
            codesign --verify --strict "$OUT/xra1n-jbboot.${arch}"
          done

          lipo -create \
            "$OUT/xra1n-jbboot.arm64" \
            "$OUT/xra1n-jbboot.arm64e" \
            -output "$OUT/xra1n-jbboot"

      - name: Verify artifact
        shell: bash
        run: |
          set -euo pipefail
          OUT=work/xra1n-jbboot
          BIN="$OUT/xra1n-jbboot"
          test "$(lipo -archs "$BIN")" = "arm64 arm64e"
          codesign --verify --strict "$BIN"
          lipo "$BIN" -thin arm64 -output "$OUT/xra1n-jbboot.verify.arm64"
          lipo "$BIN" -thin arm64e -output "$OUT/xra1n-jbboot.verify.arm64e"
          python3 - "$OUT/xra1n-jbboot.verify.arm64" \
                    "$OUT/xra1n-jbboot.verify.arm64e" \
                    "$OUT/xra1n-jbboot.entitlements" <<'PY'
          import pathlib, plistlib, subprocess, sys
          expected = plistlib.loads(pathlib.Path(sys.argv[3]).read_bytes())
          for binary in sys.argv[1:3]:
              actual = plistlib.loads(subprocess.check_output(["ldid", "-e", binary]))
              if actual != expected:
                  raise SystemExit(f"xra1n-jbboot entitlement verification failed: {binary}")
          PY
          rm "$OUT/xra1n-jbboot.verify.arm64" "$OUT/xra1n-jbboot.verify.arm64e"
          test "$(codesign -d --verbose=4 "$BIN" 2>&1 | sed -n 's/^Identifier=//p')" = \
            com.xra1n.jbboot
          file "$BIN" | grep -F 'universal binary'
          strings -a "$BIN" | grep -Fx '/private/var/tmp/bin'
          strings -a "$BIN" | grep -Fx '/var/jb/usr/bin'
          strings -a "$BIN" | grep -Fx '/private/var/tmp/usr/bin'
          strings -a "$BIN" | grep -Fx '/var/jb/usr/sbin'
          strings -a "$BIN" | grep -Fx 'xra1n-jbboot: PATH links ready'
          strings -a "$BIN" | grep -Fx 'kpersona_alloc'
          strings -a "$BIN" | grep -Fx 'kpersona_info'
          strings -a "$BIN" | grep -Fx 'xra1n-jbboot: persona 99 created'
          strings -a "$BIN" | grep -Fx 'sandbox_extension_issue_file'
          strings -a "$BIN" | grep -Fx 'com.apple.app-sandbox.read'
          strings -a "$BIN" | grep -Fx '/private/var/jb'
          strings -a "$BIN" | grep -Fx '/private/var/tmp/sbext.token'
          strings -a "$BIN" | grep -Fx 'xra1n-jbboot: sandbox read token refreshed'
          strings -a "$BIN" | grep -Fx '/var/jb/usr/bin/uicache'
          strings -a "$BIN" | grep -Fx '/var/jb/.xra1n-system-apps-registered'
          strings -a "$BIN" | grep -Fx 'xra1n-jbboot: system app registration complete'
          shasum -a 256 "$BIN" | tee "$OUT/SHA256SUMS"
          cat "$OUT/Sileo.app.tar.gz.sha256" >> "$OUT/SHA256SUMS"
          python3 - <<'PY'
          import json, os, pathlib
          out = pathlib.Path('work/xra1n-jbboot')
          metadata = {
              'artifact': 'xra1n-jbboot',
              'commit': os.environ['GITHUB_SHA'],
              'architectures': ['arm64', 'arm64e'],
              'deploymentTarget': 'iOS 18.0',
              'identifier': 'com.xra1n.jbboot',
              'installPath': '/usr/local/bin/xra1n-jbboot',
              'entitlements': [
                  'platform-application',
                  'com.apple.private.security.no-sandbox',
                  'com.apple.private.security.no-container',
                  'com.apple.private.skip-library-validation',
                  'com.apple.private.persona-mgmt',
                  'com.apple.private.spawn-subsystem-root',
              ],
          }
          (out / 'build-metadata.json').write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload xra1n-jbboot
        uses: actions/upload-artifact@v4
        with:
          name: xra1n-jbboot-${{ github.sha }}
          path: |
            work/xra1n-jbboot/xra1n-jbboot
            work/xra1n-jbboot/SHA256SUMS
            work/xra1n-jbboot/build-metadata.json
            work/xra1n-jbboot/Sileo.app.tar.gz
            work/xra1n-jbboot/Sileo.app.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
