name: Build XRa1n Hookd

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xra1n-hookd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout XRa1n
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install verification tool
        run: brew install ldid-procursus

      - name: Build and sign hookd
        shell: bash
        run: |
          set -euo pipefail
          OUT=work/xra1n-hookd
          mkdir -p "$OUT"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos --find clang)"
          for arch in arm64 arm64e; do
            "$CLANG" -target "${arch}-apple-ios18.0" -isysroot "$SDK" \
              -Os -fvisibility=hidden -fno-common -Wall -Wextra -Werror \
              -Wl,-dead_strip hookd/xra1n_hookd.c \
              -o "$OUT/xra1n-hookd.${arch}"
            codesign --force --sign - --timestamp=none \
              --entitlements hookd/entitlements.plist \
              -i com.xra1n.hookd "$OUT/xra1n-hookd.${arch}"
            codesign --verify --strict "$OUT/xra1n-hookd.${arch}"
          done
          lipo -create "$OUT/xra1n-hookd.arm64" "$OUT/xra1n-hookd.arm64e" \
            -output "$OUT/xra1n-hookd"

          # Diagnostic: same executable without privileged entitlements. A
          # standalone run should reach the registered-port check and exit 3.
          cp "$OUT/xra1n-hookd.arm64" "$OUT/xra1n-hookd.noent-probe"
          codesign --force --sign - --timestamp=none \
            -i com.xra1n.hookd.probe "$OUT/xra1n-hookd.noent-probe"
          codesign --verify --strict "$OUT/xra1n-hookd.noent-probe"
          test -z "$(ldid -e "$OUT/xra1n-hookd.noent-probe")"

          for spec in tfp debugger both; do
            ent="$OUT/$spec.plist"
            python3 - "$spec" "$ent" <<'PY'
          import plistlib, sys
          spec, path = sys.argv[1:]
          keys = {
              'tfp': ['task_for_pid-allow'],
              'debugger': ['com.apple.private.cs.debugger'],
              'both': ['task_for_pid-allow', 'com.apple.private.cs.debugger'],
          }[spec]
          with open(path, 'wb') as stream:
              plistlib.dump({key: True for key in keys}, stream)
          PY
            probe="$OUT/xra1n-hookd.$spec-probe"
            cp "$OUT/xra1n-hookd.arm64" "$probe"
            codesign --force --sign - --timestamp=none \
              --entitlements "$ent" -i "com.xra1n.hookd.$spec" "$probe"
            codesign --verify --strict "$probe"
          done

      - name: Verify artifact
        shell: bash
        run: |
          set -euo pipefail
          OUT=work/xra1n-hookd
          BIN="$OUT/xra1n-hookd"
          test "$(lipo -archs "$BIN")" = "arm64 arm64e"
          codesign --verify --strict "$BIN"
          python3 - "$BIN" hookd/entitlements.plist <<'PY'
          import pathlib, plistlib, subprocess, sys
          expected = plistlib.loads(pathlib.Path(sys.argv[2]).read_bytes())
          for arch in ('arm64', 'arm64e'):
              thin = pathlib.Path(sys.argv[1]).with_suffix('.verify-' + arch)
              subprocess.run(['lipo', sys.argv[1], '-thin', arch, '-output', thin], check=True)
              actual = plistlib.loads(subprocess.check_output(['ldid', '-e', thin]))
              thin.unlink()
              if actual != expected:
                  raise SystemExit(f'entitlement mismatch for {arch}')
          PY
          shasum -a 256 "$BIN" "$OUT"/xra1n-hookd.*-probe | tee "$OUT/SHA256SUMS"

      - name: Upload hookd
        uses: actions/upload-artifact@v4
        with:
          name: xra1n-hookd-${{ github.sha }}
          path: |
            work/xra1n-hookd/xra1n-hookd
            work/xra1n-hookd/xra1n-hookd.noent-probe
            work/xra1n-hookd/xra1n-hookd.tfp-probe
            work/xra1n-hookd/xra1n-hookd.debugger-probe
            work/xra1n-hookd/xra1n-hookd.both-probe
            work/xra1n-hookd/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
