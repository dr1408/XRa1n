name: Funny Dylibs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funny-dylibs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout XRa1n
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install signing tool
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid-procursus
          command -v ldid
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build constructor-only l8pair probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/funny-dylibs
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos --find clang)"
          SOURCE=funny-dylibs/l8pair_probe.c
          INSTALL_NAME=/usr/lib/l8pair-probe.dylib

          for arch in arm64 arm64e; do
            "$CLANG" \
              -target "${arch}-apple-ios18.0" \
              -isysroot "$SDK" \
              -Os -fvisibility=hidden -fno-common \
              -Wall -Wextra -Werror \
              -dynamiclib \
              -Wl,-install_name,"$INSTALL_NAME" \
              -Wl,-not_for_dyld_shared_cache \
              "$SOURCE" \
              -o "work/funny-dylibs/l8pair-probe.${arch}.dylib"
            # Sign each thin image with Apple's signer before lipo.  The
            # Procursus ldid build available on this runner did not emit a
            # CodeDirectory that macOS codesign recognized for these dylibs.
            codesign --force --sign - --timestamp=none \
              "work/funny-dylibs/l8pair-probe.${arch}.dylib"
            codesign --verify --strict \
              "work/funny-dylibs/l8pair-probe.${arch}.dylib"
          done

          lipo -create \
            work/funny-dylibs/l8pair-probe.arm64.dylib \
            work/funny-dylibs/l8pair-probe.arm64e.dylib \
            -output work/funny-dylibs/l8pair-probe.dylib

      - name: Verify artifact
        shell: bash
        run: |
          set -euo pipefail
          DYLIB=work/funny-dylibs/l8pair-probe.dylib
          test "$(lipo -archs "$DYLIB")" = "arm64 arm64e"
          otool -D "$DYLIB" | grep -Fx '/usr/lib/l8pair-probe.dylib'
          strings -a "$DYLIB" | grep -Fx 'XRA1N_L8PAIR_PROBE loaded pid=%d executable=%s'
          strings -a "$DYLIB" | grep -Fx '/private/var/root/Library/Lockdown/xra1n-l8pair-probe.log'
          test -z "$(ldid -e "$DYLIB")"
          codesign --verify --strict "$DYLIB"
          file "$DYLIB"
          shasum -a 256 "$DYLIB" | tee work/funny-dylibs/SHA256SUMS

      - name: Upload funny dylibs
        uses: actions/upload-artifact@v4
        with:
          name: funny-dylibs-${{ github.sha }}
          path: |
            work/funny-dylibs/l8pair-probe.dylib
            work/funny-dylibs/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
