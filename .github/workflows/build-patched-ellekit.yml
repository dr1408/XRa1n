name: Build Patched ElleKit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patched-ellekit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      ELLEKIT_COMMIT: 9211644741e38b070f132e2e5a8cfa2911f9756e
    steps:
      - name: Checkout XRa1n
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install signing tool
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid-procursus
          command -v ldid
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Checkout and patch ElleKit 1.2
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/ellekit"
          mkdir -p "$GITHUB_WORKSPACE/work"
          git clone https://github.com/tealbathingsuit/ellekit.git "$SRC"
          git -C "$SRC" checkout --detach "$ELLEKIT_COMMIT"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$ELLEKIT_COMMIT"
          git -C "$SRC" apply --check "$GITHUB_WORKSPACE/patches/ellekit/0001-fishhook-arm64e-pac.patch"
          git -C "$SRC" apply "$GITHUB_WORKSPACE/patches/ellekit/0001-fishhook-arm64e-pac.patch"
          python3 "$GITHUB_WORKSPACE/scripts/verify_ellekit_pac.py" \
            "$SRC/launchd/fishhook/fishhook.c"
          git -C "$SRC" diff --check
          git -C "$SRC" diff --binary > "$GITHUB_WORKSPACE/work/ellekit-pac.applied.patch"

      - name: Build patched pspawn
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/ellekit"
          BUILD="$GITHUB_WORKSPACE/work/ellekit-build"
          xcodebuild \
            -project "$SRC/ellekit.xcodeproj" \
            -scheme launchd \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            BUILD_DIR="$BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=''

          BIN="$BUILD/Release-iphoneos/pspawn.dylib"
          test -f "$BIN"
          ldid -S -Cadhoc "$BIN"
          codesign --verify --strict "$BIN"

      - name: Verify and stage artifact
        shell: bash
        run: |
          set -euo pipefail
          BUILD="$GITHUB_WORKSPACE/work/ellekit-build"
          BIN="$BUILD/Release-iphoneos/pspawn.dylib"
          OUT="$GITHUB_WORKSPACE/work/patched-ellekit"
          mkdir -p "$OUT"

          archs="$(lipo -archs "$BIN")"
          case " $archs " in *' arm64 '*) ;; *) echo 'pspawn lacks arm64'; exit 1;; esac
          case " $archs " in *' arm64e '*) ;; *) echo 'pspawn lacks arm64e'; exit 1;; esac
          nm -gU "$BIN" | grep -q '_rebind_symbols'
          strings -a "$BIN" | grep -Fx 'posix_spawn'
          strings -a "$BIN" | grep -Fx 'posix_spawnp'

          cp "$BIN" "$OUT/pspawn.pac.dylib"
          cp "$GITHUB_WORKSPACE/work/ellekit-pac.applied.patch" "$OUT/"
          shasum -a 256 "$OUT/pspawn.pac.dylib" > "$OUT/pspawn.pac.dylib.sha256"
          {
            echo "ellekit_commit=$ELLEKIT_COMMIT"
            echo "opa_fishhook_commit=4e468574a9e579214e9c92ea0e9ce1808be2a976"
            echo "architectures=$archs"
            xcodebuild -version | tr '\n' ' '
            echo
          } > "$OUT/BUILD-INFO.txt"
          ldid -e "$OUT/pspawn.pac.dylib" > "$OUT/pspawn.pac.entitlements.plist"

      - name: Upload patched pspawn
        uses: actions/upload-artifact@v4
        with:
          name: patched-ellekit-pspawn
          path: work/patched-ellekit
          if-no-files-found: error
