name: XR iCloud Persona Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build read-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos --find clang)"
          mkdir -p work/xr-icloud-diag
          for arch in arm64 arm64e; do
            "$CLANG" -target "${arch}-apple-ios18.0" -isysroot "$SDK" -Os \
              -fobjc-arc -fblocks -fvisibility=hidden -fno-common \
              -Wall -Wextra -Werror -dynamiclib \
              -Wl,-not_for_dyld_shared_cache \
              -Wl,-install_name,/var/jb/usr/lib/TweakInject/l8iclouddiag.dylib \
              -framework Foundation xr-runtime-fixes/l8iclouddiag.m \
              -o "work/xr-icloud-diag/l8iclouddiag.${arch}.dylib"
          done
          lipo -create work/xr-icloud-diag/l8iclouddiag.arm64.dylib \
            work/xr-icloud-diag/l8iclouddiag.arm64e.dylib \
            -output work/xr-icloud-diag/l8iclouddiag.dylib
          codesign --force --sign - --timestamp=none work/xr-icloud-diag/l8iclouddiag.dylib
          codesign --verify --strict work/xr-icloud-diag/l8iclouddiag.dylib
          test "$(lipo -archs work/xr-icloud-diag/l8iclouddiag.dylib)" = 'arm64 arm64e'
          plutil -lint xr-runtime-fixes/l8iclouddiag.plist
          python3 - <<'PY'
          import plistlib
          with open('xr-runtime-fixes/l8iclouddiag.plist', 'rb') as f:
              p = plistlib.load(f)
          assert p == {'Filter': {'Executables': [
              'AAUIFollowUpExtension', 'Preferences', 'MobileSafari']}}, p
          PY
          cp xr-runtime-fixes/l8iclouddiag.plist work/xr-icloud-diag/
          strings -a work/xr-icloud-diag/l8iclouddiag.dylib \
            | grep -Fx '/private/var/jb/.xra1n-icloud-diag'
          strings -a work/xr-icloud-diag/l8iclouddiag.dylib \
            | grep -Fx 'com.apple.adid'
          shasum -a 256 work/xr-icloud-diag/l8iclouddiag.dylib \
            work/xr-icloud-diag/l8iclouddiag.plist \
            > work/xr-icloud-diag/SHA256SUMS
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: xr-icloud-diag-${{ github.sha }}
          path: |
            work/xr-icloud-diag/l8iclouddiag.dylib
            work/xr-icloud-diag/l8iclouddiag.plist
            work/xr-icloud-diag/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
