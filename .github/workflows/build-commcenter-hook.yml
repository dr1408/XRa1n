name: Build CommCenter Hook

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commcenter-hook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout XRa1n
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install verification tool
        run: brew install ldid-procursus

      - name: Build and sign universal hook
        shell: bash
        run: |
          set -euo pipefail
          OUT=work/commcenter-hook
          mkdir -p "$OUT"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos --find clang++)"
          for arch in arm64 arm64e; do
            "$CLANG" -target "${arch}-apple-ios18.0" -isysroot "$SDK" \
              -std=c++17 -Os -fvisibility=hidden -fno-common \
              -Wall -Wextra -Werror -dynamiclib \
              -Wl,-install_name,/var/jb/usr/lib/TweakInject/XRa1nCommCenter.dylib \
              -Wl,-undefined,dynamic_lookup \
              -Wl,-not_for_dyld_shared_cache \
              commcenter-hook/xra1n_commcenter.cpp \
              -o "$OUT/XRa1nCommCenter.${arch}.dylib"
            codesign --force --sign - --timestamp=none "$OUT/XRa1nCommCenter.${arch}.dylib"
            codesign --verify --strict "$OUT/XRa1nCommCenter.${arch}.dylib"
          done
          lipo -create "$OUT/XRa1nCommCenter.arm64.dylib" \
            "$OUT/XRa1nCommCenter.arm64e.dylib" \
            -output "$OUT/XRa1nCommCenter.dylib"
          cp commcenter-hook/XRa1nCommCenter.plist "$OUT/"

      - name: Verify artifact
        shell: bash
        run: |
          set -euo pipefail
          OUT=work/commcenter-hook
          D="$OUT/XRa1nCommCenter.dylib"
          test "$(lipo -archs "$D")" = "arm64 arm64e"
          otool -D "$D" | grep -Fx /var/jb/usr/lib/TweakInject/XRa1nCommCenter.dylib
          strings -a "$D" | grep -Fx 'XRA1N_COMMCENTER family translation AND -> ORR active'
          strings -a "$D" | grep -Fx 'XRA1N_COMMCENTER family patch preimage mismatch'
          strings -a "$D" | grep -Fx 'XRA1N_COMMCENTER waiting for KCommandDrivers'
          strings -a "$D" | grep -Fx 'XRA1N_COMMCENTER hookd patch failed kr=%d'
          strings -a "$D" | grep -Fx 'XRA1N_COMMCENTER family patch write failed'
          strings -a "$D" | grep -Fx /var/jb/tmp/xra1n-commcenter-hook.log
          plutil -lint "$OUT/XRa1nCommCenter.plist"
          plutil -extract Filter.Executables.0 raw "$OUT/XRa1nCommCenter.plist" \
            | grep -Fx CommCenter
          ! otool -l "$D" | grep -q 'sectname __interpose'
          test -z "$(ldid -e "$D")"
          codesign --verify --strict "$D"
          shasum -a 256 "$D" "$OUT/XRa1nCommCenter.plist" | tee "$OUT/SHA256SUMS"

      - name: Upload CommCenter hook
        uses: actions/upload-artifact@v4
        with:
          name: commcenter-hook-${{ github.sha }}
          path: |
            work/commcenter-hook/XRa1nCommCenter.dylib
            work/commcenter-hook/XRa1nCommCenter.plist
            work/commcenter-hook/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
