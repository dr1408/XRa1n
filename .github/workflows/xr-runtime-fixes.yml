name: XR Runtime Fixes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xr-runtime-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout XRa1n
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install signing tool
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid-procursus
          command -v ldid
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build pairing and coreauth dylibs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/xr-runtime-fixes
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos --find clang)"
          for arch in arm64 arm64e; do
            TARGET="${arch}-apple-ios18.0"
            "$CLANG" -target "$TARGET" -isysroot "$SDK" -Os \
              -fvisibility=hidden -fno-common -Wall -Wextra -Werror \
              -fblocks -dynamiclib -Wl,-install_name,/usr/lib/xra1n-pair.dylib \
              -Wl,-not_for_dyld_shared_cache \
              -framework CoreFoundation -framework Foundation -framework Security \
              xr-runtime-fixes/xra1n_pair.c xr-runtime-fixes/xra1n_pair_auth.m \
              -o "work/xr-runtime-fixes/xra1n-pair.${arch}.dylib"
            codesign --force --sign - --timestamp=none \
              "work/xr-runtime-fixes/xra1n-pair.${arch}.dylib"
            codesign --verify --strict \
              "work/xr-runtime-fixes/xra1n-pair.${arch}.dylib"

            "$CLANG" -target "$TARGET" -isysroot "$SDK" -Os \
              -fvisibility=hidden -fno-common -Wall -Wextra -Werror \
              -fblocks -dynamiclib -Wl,-install_name,/usr/lib/xra1n-coreauth.dylib \
              -Wl,-not_for_dyld_shared_cache -framework Foundation \
              xr-runtime-fixes/xra1n_coreauth.m \
              -o "work/xr-runtime-fixes/xra1n-coreauth.${arch}.dylib"
            codesign --force --sign - --timestamp=none \
              "work/xr-runtime-fixes/xra1n-coreauth.${arch}.dylib"
            codesign --verify --strict \
              "work/xr-runtime-fixes/xra1n-coreauth.${arch}.dylib"
          done

          for name in xra1n-pair xra1n-coreauth; do
            lipo -create \
              "work/xr-runtime-fixes/${name}.arm64.dylib" \
              "work/xr-runtime-fixes/${name}.arm64e.dylib" \
              -output "work/xr-runtime-fixes/${name}.dylib"
          done

      - name: Build reviewed Liter8 compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos --find clang)"
          OUT=work/xr-runtime-fixes

          # Exercise the exact ACM-error matcher on the macOS runner before
          # producing the device payload. This does not install a hook.
          xcrun clang -DLITER8_LOCALAUTH_TEST \
            -DLITER8_LOCALAUTH_TRANSLATION_ONLY -framework Foundation \
            -framework LocalAuthentication xr-runtime-fixes/l8localauth.m \
            -o "$OUT/l8localauth-test"
          "$OUT/l8localauth-test"
          rm "$OUT/l8localauth-test"

          # ElleKit/TweakLoader persona payload. It resolves private classes at
          # runtime and intentionally links only Foundation.
          for arch in arm64 arm64e; do
            TARGET="${arch}-apple-ios18.0"
            "$CLANG" -target "$TARGET" -isysroot "$SDK" -Os \
              -fblocks -fvisibility=hidden -fno-common -Wall -Wextra \
              -dynamiclib -Wl,-not_for_dyld_shared_cache \
              -Wl,-install_name,/var/jb/usr/lib/TweakInject/l8persona.dylib \
              -framework Foundation xr-runtime-fixes/l8persona.m \
              -o "$OUT/l8persona.${arch}.dylib"
            # Only nehelper receives the LocalAuthentication fallback. The
            # plist filter and the constructor both enforce that scope.
            "$CLANG" -target "$TARGET" -isysroot "$SDK" -Os \
              -fblocks -fvisibility=hidden -fno-common -Wall -Wextra \
              -dynamiclib -Wl,-not_for_dyld_shared_cache \
              -Wl,-install_name,/var/jb/usr/lib/TweakInject/l8localauth.dylib \
              -framework Foundation xr-runtime-fixes/l8localauth.m \
              -o "$OUT/l8localauth.${arch}.dylib"
            # XR-only, marker-gated Files LocalStorage compatibility.
            "$CLANG" -target "$TARGET" -isysroot "$SDK" -Os \
              -fblocks -fobjc-arc -fvisibility=hidden -fno-common -Wall -Wextra -Werror \
              -dynamiclib -Wl,-not_for_dyld_shared_cache \
              -Wl,-install_name,/var/jb/usr/lib/TweakInject/l8files.dylib \
              -framework Foundation xr-runtime-fixes/l8files.m \
              -o "$OUT/l8files.${arch}.dylib"
            # PhotoForce is not an injected dylib. The privileged probe edits
            # PosterBoard's cached PosterFoundation dictionary, and pfwatch
            # reapplies it to each new PosterBoard process.
            "$CLANG" -target "$TARGET" -isysroot "$SDK" -Os \
              -fblocks -Wall -Wextra -framework Foundation \
              xr-runtime-fixes/pfruntimeprobe.m \
              -o "$OUT/pfruntimeprobe.${arch}"
            "$CLANG" -target "$TARGET" -isysroot "$SDK" -Os \
              -fblocks -Wall -Wextra -framework Foundation \
              xr-runtime-fixes/pfwatch.m \
              -o "$OUT/pfwatch.${arch}"
          done

          for name in l8persona l8localauth l8files; do
            lipo -create "$OUT/${name}.arm64.dylib" "$OUT/${name}.arm64e.dylib" \
              -output "$OUT/${name}.dylib"
            codesign --force --sign - --timestamp=none "$OUT/${name}.dylib"
            cp "xr-runtime-fixes/${name}.plist" "$OUT/${name}.plist"
          done
          for name in pfruntimeprobe pfwatch; do
            lipo -create "$OUT/${name}.arm64" "$OUT/${name}.arm64e" \
              -output "$OUT/${name}"
            # On XR 22H374 the task-port entitlements cause a pre-main exec
            # rejection. Keep ldid's ad-hoc signature, but omit entitlements;
            # the separate guarded AMFI task-port kernel patch is tested next.
            ldid -S -Cadhoc "$OUT/${name}"
          done
          # NewTerm appfix adapters. Replace /var/jb/usr/bin/login and
          # /var/jb/Applications/NewTerm.app/NewTermLoginHelper. The Data
          # volume is nosuid on XR, so login cannot gain root through the
          # setuid bit; newterm-login spawns a persona-99 child with uid/gid
          # 0 and re-execs real login as root. No entitlements required.
          for arch in arm64 arm64e; do
            TARGET="${arch}-apple-ios18.0"
            for name in newterm-login newterm-helper; do
              "$CLANG" -target "$TARGET" -isysroot "$SDK" -Os \
                -fblocks -Wall -Wextra -Werror \
                xr-runtime-fixes/${name}.c \
                -o "$OUT/${name}.${arch}"
            done
          done
          for name in newterm-login newterm-helper; do
            lipo -create "$OUT/${name}.arm64" "$OUT/${name}.arm64e" \
              -output "$OUT/${name}"
          done
          # newterm-login needs the bisected AMFI-safe entitlement set to call
          # posix_spawn with persona-99 attributes. newterm-helper has no such
          # need and is adhoc-signed without entitlements.
          ldid -Sxr-runtime-fixes/newterm-login.entitlements -Cadhoc \
            "$OUT/newterm-login"
          ldid -S -Cadhoc "$OUT/newterm-helper"
          rm -f "$OUT"/*.arm64 "$OUT"/*.arm64e \
                "$OUT"/*.arm64.dylib "$OUT"/*.arm64e.dylib

      - name: Verify artifact
        shell: bash
        run: |
          set -euo pipefail
          for DYLIB in work/xr-runtime-fixes/xra1n-pair.dylib \
                       work/xr-runtime-fixes/xra1n-coreauth.dylib; do
            test "$(lipo -archs "$DYLIB")" = "arm64 arm64e"
            codesign --verify --strict "$DYLIB"
            test -z "$(ldid -e "$DYLIB")"
          done
          otool -D work/xr-runtime-fixes/xra1n-pair.dylib \
            | grep -Fx '/usr/lib/xra1n-pair.dylib'
          otool -D work/xr-runtime-fixes/xra1n-coreauth.dylib \
            | grep -Fx '/usr/lib/xra1n-coreauth.dylib'
          for arch in arm64 arm64e; do
            size=$(otool -arch "$arch" -l work/xr-runtime-fixes/xra1n-pair.dylib \
              | awk '/sectname __interpose/{found=1} found && /size/{print $2; exit}')
            test "$size" = 0x0000000000000030
          done
          strings -a work/xr-runtime-fixes/xra1n-pair.dylib \
            | grep -Fx '/private/var/root/Library/Lockdown/.xra1n-pairing-fallback'
          strings -a work/xr-runtime-fixes/xra1n-pair.dylib \
            | grep -F 'policy 1028 measured LA failure'
          strings -a work/xr-runtime-fixes/xra1n-coreauth.dylib \
            | grep -F 'ratchetStateFromState:'
          for DYLIB in work/xr-runtime-fixes/l8persona.dylib \
                       work/xr-runtime-fixes/l8localauth.dylib \
                       work/xr-runtime-fixes/l8files.dylib; do
            test "$(lipo -archs "$DYLIB")" = "arm64 arm64e"
            codesign --verify --strict "$DYLIB"
            test -z "$(ldid -e "$DYLIB")"
          done
          ! otool -L work/xr-runtime-fixes/l8persona.dylib \
            | grep -q InstalledContentLibrary
          strings -a work/xr-runtime-fixes/l8persona.dylib \
            | grep -Fx 'CONTAINER_PERSONA_PRIMARY'
          plutil -lint work/xr-runtime-fixes/l8persona.plist
          plutil -lint work/xr-runtime-fixes/l8localauth.plist
          plutil -lint work/xr-runtime-fixes/l8files.plist
          otool -D work/xr-runtime-fixes/l8localauth.dylib \
            | grep -Fx '/var/jb/usr/lib/TweakInject/l8localauth.dylib'
          ! otool -L work/xr-runtime-fixes/l8localauth.dylib \
            | grep -q LocalAuthentication
          strings -a work/xr-runtime-fixes/l8localauth.dylib \
            | grep -Fx '/private/var/jb/.liter8-localauth'
          strings -a work/xr-runtime-fixes/l8files.dylib \
            | grep -Fx '/var/jb/.xra1n-files'
          strings -a work/xr-runtime-fixes/l8files.dylib \
            | grep -Fx '22H374'
          python3 - <<'PY'
          import plistlib
          with open('work/xr-runtime-fixes/l8localauth.plist', 'rb') as f:
              plist = plistlib.load(f)
          assert plist == {'Filter': {'Executables': ['nehelper']}}, plist
          with open('work/xr-runtime-fixes/l8files.plist', 'rb') as f:
              plist = plistlib.load(f)
          assert plist == {'Filter': {'Executables': ['fileproviderd', 'LocalStorageFileProvider']}}, plist
          PY
          for BIN in work/xr-runtime-fixes/pfruntimeprobe \
                     work/xr-runtime-fixes/pfwatch \
                     work/xr-runtime-fixes/newterm-helper; do
            test "$(lipo -archs "$BIN")" = "arm64 arm64e"
            codesign --verify --strict "$BIN"
            test -z "$(ldid -e "$BIN")"
          done
          # newterm-login must carry the six-entitlement set and nothing else.
          test "$(lipo -archs work/xr-runtime-fixes/newterm-login)" = "arm64 arm64e"
          codesign --verify --strict work/xr-runtime-fixes/newterm-login
          # Fat binary: ldid -e prints one plist per slice; keep only the first.
          ldid -e work/xr-runtime-fixes/newterm-login \
            | awk '/<\?xml/{p=1} p{print} /<\/plist>/{if (p) exit}' \
            | tee /tmp/newterm-login.ents
          plutil -lint /tmp/newterm-login.ents
          python3 - <<'PY'
          import plistlib
          with open('/tmp/newterm-login.ents', 'rb') as f:
              ents = plistlib.load(f)
          expected = {
              'platform-application': True,
              'com.apple.private.security.no-sandbox': True,
              'com.apple.private.security.no-container': True,
              'com.apple.private.skip-library-validation': True,
              'com.apple.private.persona-mgmt': True,
              'com.apple.private.spawn-subsystem-root': True,
          }
          assert ents == expected, ents
          PY
          strings -a work/xr-runtime-fixes/pfruntimeprobe \
            | grep -Fx 'PFPosterPathURLResourceValues'
          strings -a work/xr-runtime-fixes/pfwatch \
            | grep -Fx '/Applications/PosterBoard.app/PosterBoard'
          strings -a work/xr-runtime-fixes/newterm-login \
            | grep -Fx 'iPhone11,8'
          strings -a work/xr-runtime-fixes/newterm-login \
            | grep -Fx '22H374'
          strings -a work/xr-runtime-fixes/newterm-login \
            | grep -Fx '/var/jb/usr/bin/login.liter8-real'
          strings -a work/xr-runtime-fixes/newterm-helper \
            | grep -Fx -e '-NewTermLoginHelper'
          file "$DYLIB"
          shasum -a 256 \
            work/xr-runtime-fixes/*.dylib \
            work/xr-runtime-fixes/*.plist \
            work/xr-runtime-fixes/pfruntimeprobe \
            work/xr-runtime-fixes/pfwatch \
            work/xr-runtime-fixes/newterm-login \
            work/xr-runtime-fixes/newterm-helper \
            | tee work/xr-runtime-fixes/SHA256SUMS

      - name: Upload XR runtime fixes
        uses: actions/upload-artifact@v4
        with:
          name: xr-runtime-fixes-${{ github.sha }}
          path: |
            work/xr-runtime-fixes/xra1n-pair.dylib
            work/xr-runtime-fixes/xra1n-coreauth.dylib
            work/xr-runtime-fixes/l8persona.dylib
            work/xr-runtime-fixes/l8persona.plist
            work/xr-runtime-fixes/l8localauth.dylib
            work/xr-runtime-fixes/l8localauth.plist
            work/xr-runtime-fixes/l8files.dylib
            work/xr-runtime-fixes/l8files.plist
            work/xr-runtime-fixes/pfruntimeprobe
            work/xr-runtime-fixes/pfwatch
            work/xr-runtime-fixes/newterm-login
            work/xr-runtime-fixes/newterm-helper
            work/xr-runtime-fixes/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
